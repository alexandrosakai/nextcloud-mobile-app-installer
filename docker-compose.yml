services:
  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?defina NEXTCLOUD_ADMIN_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - nextcloud_data:/var/www/html
      - ./apps/mobile_installer:/var/www/html/custom_apps/mobile_installer

volumes:
  nextcloud_data:
